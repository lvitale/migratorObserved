name: CI - Verificación de Código

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  verificar-codigo:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el repositorio en el runner
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configura Java 8 (Temurin)
      - name: Configurar Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      # 3. Compila y ejecuta pruebas con Maven
      - name: Compilar y verificar con Maven
        run: mvn clean test
