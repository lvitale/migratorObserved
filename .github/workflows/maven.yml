yaml
name: Java CI with Maven (Java 8)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura Java 8 (JDK 1.8) usando la acción oficial
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin' # Distribución de OpenJDK recomendada
          cache: 'maven'        # Guarda en caché las dependencias de Maven para acelerar futuras ejecuciones

      # 3. Dar permisos de ejecución al wrapper de Maven (opcional si usas ./mvnw)
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 4. Compilar y ejecutar pruebas con Maven
      - name: Build and test with Maven
        run: mvn clean verify
